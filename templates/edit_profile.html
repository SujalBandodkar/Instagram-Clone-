{% extends "base.html" %}
{% block title %}Edit Profile - Instagram{% endblock %}
{% block content %}
<div class="form-container">
    <div class="form-box">
        <h2 class="form-title">Edit Profile</h2>
        <form method="POST" enctype="multipart/form-data" action="{{ url_for('controller.edit_profile') }}">
            {% if user.profile_picture %}
            <div class="current-image">
                <img src="{{ url_for('static', filename='uploads/' + user.profile_picture) }}">
                <div class="current-image-label">Current Profile Picture</div>
            </div>
            {% endif %}
            <div class="form-group">
                <label>Profile Picture</label>
                <input type="file" name="profile_picture">
            </div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" value="{{ user.username }}" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ user.email }}" required>
            </div>
            <div class="form-group">
                <label>Bio</label>
                <textarea name="bio">{{ user.bio }}</textarea>
            </div>
            <button type="submit" class="form-submit">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
