{% extends "base.html" %}

{% block title %}Create Story - Instagram{% endblock %}

{% block content %}
<div class="form-container">
    <div class="form-box">
        <h2 class="form-title">Create Story</h2>
        <form method="POST" enctype="multipart/form-data" action="{{ url_for('controller.create_story') }}">
            <div class="form-group">
                <label>Image</label>
                <input type="file" name="image" accept="image/*" required>
            </div>
            <div class="form-group">
                <label>Caption</label>
                <input type="text" name="caption" placeholder="Add a caption...">
            </div>
            <button class="form-submit" type="submit">Share Story</button>
        </form>
    </div>
</div>
{% endblock %}
