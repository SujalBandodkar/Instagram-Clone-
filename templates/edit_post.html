{% extends "base.html" %}
{% block title %}Edit Post - Instagram{% endblock %}
{% block content %}
<div class="form-container">
    <div class="form-box">
        <h2 class="form-title">Edit Post</h2>
        <form method="POST" enctype="multipart/form-data" action="{{ url_for('controller.edit_post', post_id=post.id) }}">
            {% if post.image %}
            <div class="current-image">
                <img src="{{ url_for('static', filename='uploads/' + post.image) }}">
                <div class="current-image-label">Current Image</div>
            </div>
            {% endif %}
            <div class="form-group">
                <label>Caption</label>
                <textarea name="content">{{ post.content }}</textarea>
            </div>
            <div class="form-group">
                <label>Change Image</label>
                <input type="file" name="image" accept="image/*">
            </div>
            <button type="submit" class="form-submit">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
