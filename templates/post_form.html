{% extends "base.html" %}
{% block title %}Create Post - Instagram{% endblock %}
{% block content %}
<div class="form-container">
    <div class="form-box">
        <h2 class="form-title">Create New Post</h2>
        <form method="POST" enctype="multipart/form-data" action="{{ url_for('controller.create_post') }}">
            <div class="form-group">
                <label>Caption</label>
                <textarea name="content"></textarea>
            </div>
            <div class="form-group">
                <label>Image</label>
                <input type="file" name="image" accept="image/*">
            </div>
            <button type="submit" class="form-submit">Share</button>
        </form>
    </div>
</div>
{% endblock %}
