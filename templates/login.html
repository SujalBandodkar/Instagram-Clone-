<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Instagram</title>
    <link rel="icon" href="{{ url_for('static', filename='css/Instagram_icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-wrapper">
        <div class="auth-box">
            <h1 class="auth-logo">Instagram</h1>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <p class="auth-error">{{ message }}</p>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form class="auth-form" method="POST" action="{{ url_for('controller.login') }}">
                <input type="email" name="email" placeholder="Email" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit" class="auth-btn">Log In</button>
            </form>
        </div>
        <div class="auth-switch">
            Don't have an account? <a href="{{ url_for('controller.register') }}">Sign up</a>
        </div>
    </div>
</body>
</html>
